services:

  # ── PostgreSQL database ──────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       nawahub
      POSTGRES_USER:     nawahub
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nawahub"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── NestJS API ───────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL:  "postgresql://nawahub:${DB_PASSWORD:-changeme}@db:5432/nawahub"
      JWT_SECRET:    ${JWT_SECRET:?JWT_SECRET is required — see .env.example}
      NODE_ENV:      ${NODE_ENV:-production}
      PORT:          3000
      # With NODE_ENV=production the API sets secure cookies — HTTPS is required
      # for the browser to accept them. For local HTTP testing set NODE_ENV=development.
      FRONTEND_URL:  ${APP_URL:-http://localhost}
      APP_URL:       ${APP_URL:-http://localhost}
      CRON_SECRET:   ${CRON_SECRET:-}
      SENTRY_DSN:    ${SENTRY_DSN:-}
      SMTP_HOST:     ${SMTP_HOST:-}
      SMTP_PORT:     ${SMTP_PORT:-587}
      SMTP_USER:     ${SMTP_USER:-}
      SMTP_PASS:     ${SMTP_PASS:-}
      SMTP_FROM:     ${SMTP_FROM:-}
    depends_on:
      db:
        condition: service_healthy
    # Backend is not published directly; nginx proxies /api/ to it.
    expose:
      - "3000"

  # ── React frontend + nginx reverse proxy ────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # /api is a relative path — nginx rewrites it to http://backend:3000/api/
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
