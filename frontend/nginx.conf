server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # Proxy all /api/ calls to the backend service.
    # Cookies and headers are forwarded transparently.
    location /api/ {
        proxy_pass         http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Cookie            $http_cookie;
        # Allow upgrade headers (SSE / WebSocket if added later)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        # Increase timeouts for long-running operations (PDF generation, exports)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # SPA fallback — React Router handles client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Prevent indexing of nginx default files
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
